      const [isAnswered, setIsAnswered] = useState(false);

        setCurrentStep('quiz');
        setCurrentQuestionIndex(0);
        setScore(0);
        setSelectedOption(null);
        setIsAnswered(false);
      };

      const handleOptionClick = (index) => {
        if (isAnswered) return;
        
        setSelectedOption(index);
        setIsAnswered(true);
        
        if (index === quizData[currentQuestionIndex].correctIndex) {
          setScore(score + 1);
        }
      };

      const handleNextQuestion = () => {
        if (currentQuestionIndex < quizData.length - 1) {
          setCurrentQuestionIndex(currentQuestionIndex + 1);
          setSelectedOption(null);
          setIsAnswered(false);
        } else {
          setCurrentStep('result');
        }
      };

                {/* Header & Progress */}
                <div className="p-6 pb-2 border-b border-slate-100">
                  <div className="flex justify-between items-center mb-4 text-sm font-medium text-slate-500">
                    <span>Question {currentQuestionIndex + 1} of {quizData.length}</span>
                    <span className="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-xs">
                      スコア: {score}
                    </span>
                  </div>
                  <div className="w-full bg-slate-100 rounded-full h-2 mb-4">
                    <div 
                      className="bg-indigo-500 h-2 rounded-full transition-all duration-500"
                      style={{ width: `${((currentQuestionIndex + 1) / quizData.length) * 100}%` }}
                    ></div>
                  </div>
                  <h2 className="text-xl font-bold text-slate-800 leading-snug mt-4 mb-2">
                    {quizData[currentQuestionIndex].question}
                  </h2>
                </div>

                {/* Options */}
                <div className="p-6 space-y-3 flex-grow overflow-y-auto">
                  {quizData[currentQuestionIndex].options.map((option, index) => {
                    const isCorrect = index === quizData[currentQuestionIndex].correctIndex;
                    const isSelected = selectedOption === index;
                    
                    let buttonStyle = "bg-white border-2 border-slate-200 text-slate-700 hover:border-indigo-300 hover:bg-indigo-50";
                    let IconComponent = null;

                    if (isAnswered) {
                      if (isCorrect) {
                        buttonStyle = "bg-green-50 border-2 border-green-500 text-green-800 font-medium";
                        IconComponent = <CheckCircleIcon className="w-5 h-5 text-green-500 flex-shrink-0" />;
                      } else if (isSelected) {
                        buttonStyle = "bg-red-50 border-2 border-red-400 text-red-800";
                        IconComponent = <XCircleIcon className="w-5 h-5 text-red-500 flex-shrink-0" />;
                      } else {
                        buttonStyle = "bg-white border-2 border-slate-100 text-slate-400 opacity-60";
                      }
                    }

                    return (
                      <button
                        key={index}
                        onClick={() => handleOptionClick(index)}
                        disabled={isAnswered}
                        className={`w-full text-left p-4 rounded-2xl transition-all duration-200 flex justify-between items-center gap-3 ${buttonStyle} ${!isAnswered && 'active:scale-[0.98]'}`}
                      >
                        <span className="leading-relaxed text-sm md:text-base">{option}</span>
                        {IconComponent}
                      </button>
                    );
                  })}
                </div>

                {/* Explanation & Next Button */}
                {isAnswered && (
                  <div className="p-6 bg-slate-50 border-t border-slate-100">
                    <div className={`p-4 rounded-xl mb-4 ${selectedOption === quizData[currentQuestionIndex].correctIndex ? 'bg-green-100 text-green-800' : 'bg-slate-200 text-slate-700'}`}>
                      <p className="font-bold mb-1 flex items-center gap-2">
                        {selectedOption === quizData[currentQuestionIndex].correctIndex ? (
                          <><CheckCircleIcon className="w-5 h-5"/> 正解！</>
                        ) : (
                          <><XCircleIcon className="w-5 h-5"/> おしい！</>
                        )}
                      </p>
                      <p className="text-sm leading-relaxed">{quizData[currentQuestionIndex].explanation}</p>
                    </div>
                    <button
                      onClick={handleNextQuestion}
                      className="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-4 px-6 rounded-2xl transition-all active:scale-95 flex items-center justify-center gap-2"
                    >
                      {currentQuestionIndex < quizData.length - 1 ? '次の問題へ' : '結果を見る'}
                      <ChevronRightIcon className="w-5 h-5" />
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* --- Result Screen --- */}
            {currentStep === 'result' && (
              <div className="p-8 text-center flex flex-col items-center">
                <div className="w-24 h-24 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-full flex items-center justify-center mb-6 shadow-lg text-white">
                  <span className="text-3xl font-bold">{score}/{quizData.length}</span>
                </div>
                <h2 className="text-2xl font-bold text-slate-800 mb-2">お疲れ様でした！</h2>
                <p className="text-slate-600 mb-8 leading-relaxed">
                  {score === quizData.length 
                    ? "全問正解！素晴らしい理解度です。この調子で学びを進めていきましょう！" 
                    : score >= quizData.length * 0.7 
                      ? "よくできました！間違えたところは「わからない」を楽しんで、また復習してみてくださいね。"
                      : "挑戦ありがとうございます！音声で言われていた通り、わからなくて当然の時期です。何度も触れてインストールしていきましょう！"}
                </p>
                <button 
                  onClick={handleStart}
                  className="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold py-4 px-6 rounded-2xl transition-all active:scale-95 flex items-center justify-center gap-2"
                >
                  <RotateCcwIcon className="w-5 h-5" />
                  もう一度挑戦する
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
